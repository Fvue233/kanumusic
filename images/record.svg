<?xml version="1.0" encoding="UTF-8"?>
<svg width="150" height="150" viewBox="0 0 150 150" xmlns="http://www.w3.org/2000/svg">
  <!-- 唱片背景 -->
  <circle cx="75" cy="75" r="75" fill="#1a1a1a"/>
  <circle cx="75" cy="75" r="72" fill="#333"/>
  
  <!-- 唱片细纹 -->
  <defs>
    <pattern id="grooves" width="5" height="5" patternUnits="userSpaceOnUse">
      <path d="M 0 5 A 5 5 0 0 1 5 0 L 5 5 Z" fill="#444"/>
    </pattern>
  </defs>
  <circle cx="75" cy="75" r="65" fill="url(#grooves)" opacity="0.7"/>
  
  <!-- 唱片标签 -->
  <circle cx="75" cy="75" r="25" fill="#2c3e50"/>
  <circle cx="75" cy="75" r="22" fill="#34495e"/>
  
  <!-- 唱片中心孔 -->
  <circle cx="75" cy="75" r="8" fill="#fff"/>
  <circle cx="75" cy="75" r="3" fill="#333"/>
  
  <!-- 唱片反光效果 -->
  <ellipse cx="55" cy="55" rx="25" ry="15" fill="#fff" opacity="0.1"/>
</svg>